[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry %(ENV_GEOMETRY)s -depth 24 -rfbport 5900 -SecurityTypes None -localhost no -AlwaysShared
user=bridge
environment=HOME="/home/bridge"
priority=10
autorestart=true

[program:control]
command=/usr/bin/python3 /opt/constella/control.py
user=bridge
environment=HOME="/home/bridge",DISPLAY=":1"
priority=20
autorestart=true

[program:scrcpy]
command=/opt/constella/start-scrcpy.sh
user=bridge
environment=HOME="/home/bridge",DISPLAY=":1"
priority=30
autorestart=true
startsecs=5
startretries=1000000
