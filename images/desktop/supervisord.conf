[program:xvnc]
command=/usr/bin/Xvnc :1 -geometry %(ENV_GEOMETRY)s -depth 24 -rfbport 5900 -SecurityTypes None -localhost no -AlwaysShared -AcceptSetDesktopSize
user=desktop
environment=HOME="/home/desktop"
priority=10
autorestart=true

[program:session]
command=/opt/constella/start-session.sh
user=desktop
environment=HOME="/home/desktop",DISPLAY=":1"
priority=20
autorestart=true
startsecs=3

[program:control]
command=/usr/bin/python3 /opt/constella/control.py
user=desktop
environment=HOME="/home/desktop",DISPLAY=":1"
priority=30
autorestart=true

[program:cdp]
command=/usr/bin/socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
priority=40
autorestart=true
