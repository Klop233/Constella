name: constella

services:
  hub:
    image: constella-hub:latest
    build:
      context: ..
      dockerfile: images/hub/Dockerfile
      # Builds use the host's network and DNS: a resolver only the host reaches (Tailscale MagicDNS, a VPN)
      # otherwise leaves package downloads hanging inside the build.
      network: host
    container_name: constella-hub
    restart: unless-stopped
    env_file: .env
    environment:
      CONSTELLA_DATA_DIR: ${CONSTELLA_DATA_DIR:-/srv/constella}
      CONSTELLA_PORT: "8780"
    ports:
      - "127.0.0.1:8780:8780"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and outside: the hub passes these paths to agent/desktop containers.
      - ${CONSTELLA_DATA_DIR:-/srv/constella}:${CONSTELLA_DATA_DIR:-/srv/constella}
      # Read-only host view for the performance page (CPU, memory, network of the machine, not just the hub container).
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - constella-net

  # Images the hub starts on demand (built here, never run by compose).
  agent-image:
    image: constella-agent:latest
    build:
      context: ..
      dockerfile: images/agent/Dockerfile
      network: host
    profiles: ["images"]

  # Only pulled during the one-click installation; the hub manages the actual container on demand.
  office-image:
    image: ${CONSTELLA_OFFICE_IMAGE:-onlyoffice/documentserver:latest}
    profiles: ["images"]

  desktop-image:
    image: constella-desktop:latest
    build:
      context: ../images/desktop
      network: host
    profiles: ["images"]

  # Screen and control for Android instances; the Android system images themselves depend on the host and are built
  # with scripts/build-android-images.sh.
  android-bridge-image:
    image: constella-android-bridge:latest
    build:
      context: ../images/android-bridge
      network: host
    profiles: ["images"]

  # Public entry through Cloudflare Tunnel (set up with scripts/enable-public.sh)
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    container_name: constella-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # config.yml + creds.json created by scripts/enable-public.sh
      - /srv/constella/cloudflared:/etc/cloudflared:ro
    profiles: ["public"]
    networks:
      - constella-net

networks:
  constella-net:
    name: constella-net
