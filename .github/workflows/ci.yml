name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # A few hub tests drive a real Chromium (page HTML extraction); they skip themselves when none is found.
      - run: pnpm --filter @constella/hub exec playwright-core install --with-deps chromium
      - run: pnpm test
      - run: pnpm --filter @constella/web build
